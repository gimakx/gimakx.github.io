const SALT    = "RGKqacn3aKGDGkg94hP8eg==";
const IV      = "zw74y5LX39GBhZ9n";
const ITER    = 310000;

const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('b');
  const err = document.getElementById('e');
  const pw  = document.getElementById('p').value;
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Unlocking\u2026';

  try {
    const baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      true,
      ['decrypt']
    );
    // AES-GCM's auth tag makes this throw on a wrong password. No hash of the
    // password is stored anywhere, so there is nothing offline-crackable here
    // beyond the ciphertext itself.
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: bytes(IV) }, key, bytes(PAYLOAD)
    );

    // Hand the calculator the derived key (for reading quotes saved by older
    // builds) AND the password itself. Saved quotes derive their own key from
    // a per-record salt, so they survive a rebuild — the build's salt is
    // random each time and must never be what protects stored data.
    const raw = await crypto.subtle.exportKey('raw', key);
    window.__QK = raw;
    window.__QP = pw;

    const html = new TextDecoder().decode(plain);
    // Kept so the page can re-encrypt itself under a new password in-browser.
    window.__SRC = html;
    document.open();
    document.write(html);
    document.close();
  } catch {
    err.textContent = 'Incorrect password.';
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }
});
})();
