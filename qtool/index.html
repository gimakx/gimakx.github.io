const SALT    = "0TbFwTF1mdR+Cxf1RJYDUw==";
const IV      = "9xzJLCzkgOZbhrEe";
const ITER    = 310000;

const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const utf8 = (s) => new TextEncoder().encode(s);

// A reload keeps the tab unlocked (user, Oct 17 2026). The password is kept
// for this tab only, in sessionStorage, which the browser drops when the tab
// closes; it is sealed with a key the browser will not give out
// (non-extractable, kept in IndexedDB), so the stored copy alone opens nothing;
// and it lapses KEEP_MS after it was typed. The page's Lock button and its
// password change remove it (key name shared with the page source).
const KEEP = 'gmx_unlock';
const KEEP_MS = 12 * 3600e3;

function idb(mode, op) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('gimakx-gate', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const db = r.result;
      const q = op(db.transaction('k', mode).objectStore('k'));
      q.onsuccess = () => { db.close(); res(q.result); };
      q.onerror = () => { db.close(); rej(q.error); };
    };
  });
}

async function remember(pw) {
  try {
    let seal = await idb('readonly', (s) => s.get('seal'));
    if (!seal) {
      seal = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      await idb('readwrite', (s) => s.put(seal, 'seal'));
    }
    const at = String(Date.now());
    const iv = crypto.getRandomValues(new Uint8Array(12));
    // The time is bound in as additional data, so it cannot be moved forward.
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: utf8(at) }, seal, utf8(pw));
    sessionStorage.setItem(KEEP, JSON.stringify({ at, iv: b64(iv), ct: b64(ct) }));
  } catch {}   // storage refused (some private windows): a reload asks again
}

async function recall() {
  const s = JSON.parse(sessionStorage.getItem(KEEP) || 'null');
  const age = s ? Date.now() - Number(s.at) : NaN;
  if (!(age >= 0 && age < KEEP_MS)) throw new Error('expired');
  const seal = await idb('readonly', (st) => st.get('seal'));
  if (!seal) throw new Error('no key');
  const pw = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: bytes(s.iv), additionalData: utf8(s.at) }, seal, bytes(s.ct)
  );
  return new TextDecoder().decode(pw);
}

async function unlock(pw, keep) {
  const baseKey = await crypto.subtle.importKey(
    'raw', utf8(pw), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    true,
    ['decrypt']
  );
  // AES-GCM's auth tag makes this throw on a wrong password. No hash of the
  // password is stored anywhere, so there is nothing offline-crackable here
  // beyond the ciphertext itself.
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: bytes(IV) }, key, bytes(PAYLOAD)
  );
  if (keep) await remember(pw);

  // Hand the calculator the derived key (for reading quotes saved by older
  // builds) AND the password itself. Saved quotes derive their own key from
  // a per-record salt, so they survive a rebuild — the build's salt is
  // random each time and must never be what protects stored data.
  const raw = await crypto.subtle.exportKey('raw', key);
  window.__QK = raw;
  window.__QP = pw;

  const html = new TextDecoder().decode(plain);
  // Kept so the page can re-encrypt itself under a new password in-browser.
  window.__SRC = html;
  document.open();
  document.write(html);
  document.close();
}

const btn = document.getElementById('b');
const busy = (on) => {
  btn.disabled = on;
  btn.textContent = on ? 'Unlocking\u2026' : 'Unlock';
};

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const err = document.getElementById('e');
  err.textContent = '';
  busy(true);
  try {
    await unlock(document.getElementById('p').value, true);
  } catch {
    err.textContent = 'Incorrect password.';
    busy(false);
  }
});

// Unlocked in this tab before: open straight away. A stale or rebuilt-away
// password just falls back to the form.
let kept = null;
try { kept = sessionStorage.getItem(KEEP); } catch {}
if (kept) {
  busy(true);
  recall().then((pw) => unlock(pw, false)).catch(() => {
    try { sessionStorage.removeItem(KEEP); } catch {}
    busy(false);
    document.getElementById('p').focus();
  });
}
})();
